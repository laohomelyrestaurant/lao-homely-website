<!DOCTYPE html>
<html lang="vi" data-lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
<title>Món đặc biệt hôm nay - quản lý</title>
<link rel="stylesheet" href="css/style.css?v=20261125e">
<style>main{max-width:640px;margin:0 auto;padding:16px}label{display:block;margin:.7rem 0;font-weight:700}input{width:100%;padding:.7rem;font-size:1rem;box-sizing:border-box}.sp-pick{display:flex;align-items:center;justify-content:center;min-height:5.5rem;border:2px dashed #c9a227;border-radius:14px;background:#fffaf0;font-size:1.15rem;cursor:pointer}#sp-file{position:absolute;width:1px;height:1px;opacity:0}#sp-file:focus-visible{outline:none}#sp-msg{padding:.6rem;border-radius:10px;min-height:2.6rem;background:#f6e6bd}#sp-form .btn{width:100%}</style>
</head>
<body>
<main>
<h1>Món đặc biệt hôm nay</h1>
<p>Mỗi ngày tối đa 4 món, hiện ở trang chủ đúng ngày đã chọn.</p>
<form id="sp-form">
<label>Ngày có món / ວັນທີ <input type="date" id="sp-day" required></label>
<label class="sp-pick" for="sp-file">📷 Chọn ảnh món / ເລືອກຮູບ</label>
<input type="file" id="sp-file" accept="image/*,.heic,.heif">
<p id="sp-msg" style="font-weight:700"></p>
<img id="sp-prev" class="sp-photo" alt="" hidden>
<label>Tên món tiếng Lào / ຊື່ລາວ (có thể để trống) <input id="sp-lo" maxlength="80"></label>
<label>Tên món tiếng Anh <input id="sp-en" maxlength="80"></label>
<label>Tên món tiếng Việt <input id="sp-vi" maxlength="80"></label>
<label>Giá (ví dụ 75.000 Lak) <input id="sp-price" maxlength="30"></label>
<button class="btn btn-primary btn-lg" type="submit">+ Thêm món / ເພີ່ມ</button>
</form>
<h2>Món đã thêm: <span id="sp-count">0/4</span></h2>
<div id="sp-list"></div>
<p><a href="index.html">Xem trang chủ</a></p>
</main>

</html>
