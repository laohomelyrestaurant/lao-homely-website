<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
<title>Đặc sản hôm nay - quản lý</title>
<link rel="stylesheet" href="css/style.css?v=20261125b">
<style>main{max-width:640px;margin:0 auto;padding:16px}label{display:block;margin:.7rem 0;font-weight:700}input{width:100%;padding:.7rem;font-size:1rem;box-sizing:border-box}</style>
</head>
<body>
<main>
<h1>Đặc sản hôm nay</h1>
<form id="sp-form">
<label>Ngày có món / ວັນທີ <input type="date" id="sp-day" required></label>
<label>Ảnh món / ຮູບ <input type="file" id="sp-file" accept="image/*"></label>
<img id="sp-prev" class="sp-photo" alt="" hidden>
<label>Tên món tiếng Lào / ຊື່ລາວ <input id="sp-lo" maxlength="80"></label>
<label>Tên món tiếng Anh <input id="sp-en" maxlength="80"></label>
<label>Tên món tiếng Việt <input id="sp-vi" maxlength="80"></label>
<label>Giá (ví dụ 75.000 Lak) <input id="sp-price" maxlength="30"></label>
<button class="btn btn-primary btn-lg" type="submit">+ Thêm món / ເພີ່ມ</button>
<p id="sp-msg" style="font-weight:700"></p>
</form>
<h2>Món đã thêm trong ngày</h2>
<div id="sp-list"></div>
<p><a href="index.html">Xem trang chủ</a></p>
</main>
